# 代码级编译验证 CI，在每次 push / PR 时构建全部模块并运行单元/集成测试。
# 修正: 使用与历史成功版本相同的 SDK 配置 (android-actions/setup-android@v4)，
#       旧的手动下载路径 commandlinetools-linux-12081478_latest.zip 已 404。

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify-compile:
    name: Compile All Modules (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java-version: [17]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK (SDK version from gradle)
        uses: android-actions/setup-android@v4

      - name: Build all modules
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: |
          ./gradlew --no-daemon --stacktrace :app-ui:testDebugUnitTest :xposed:testDebugUnitTest
